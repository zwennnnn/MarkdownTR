<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkdownTR</title>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="popup.css">
</head>
<body class="bg-background text-foreground">
  <div class="container">
    <!-- Header -->
    <div class="bg-card border-b p-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
          <div class="icon-container">
            <img src="icons/icon48.png" alt="MarkdownTR" class="w-12 h-12 rounded-lg shadow-lg animate-pulse" />
          </div>
          <div>
            <h1 class="text-xl font-bold gradient-text">MarkdownTR</h1>
            <p class="text-sm text-muted-foreground font-medium">Web içeriğini Markdown'a çevir</p>
          </div>
        </div>
        <button id="theme-toggle" class="btn-icon transition-all">
          <div class="w-5 h-5">🌙</div>
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="p-6 space-y-6">
      <!-- Action Buttons -->
      <div class="space-y-4">
        <button id="convert-selected" class="w-full btn-primary rounded-md transition-all flex items-center justify-center space-x-3">
          <span class="text-lg">📝</span>
          <span class="font-semibold">Seçili Metni Çevir</span>
        </button>
        
        <button id="convert-page" class="w-full btn-secondary rounded-md transition-all flex items-center justify-center space-x-3">
          <span class="text-lg">📄</span>
          <span class="font-semibold">Tüm Sayfayı Çevir</span>
        </button>
      </div>

      <!-- Progress Bar (Hidden by default) -->
      <div id="progress-container" class="progress-container hidden">
        <div class="progress-bar" id="progress-bar"></div>
        <p class="text-sm text-muted-foreground mt-1" id="progress-text">İçerik çevriliyor...</p>
      </div>

      <!-- Separator -->
      <div class="border-t"></div>

      <!-- AI Configuration -->
      <div class="space-y-3">
        <h3 class="text-sm font-medium text-foreground">🤖 AI Ayarları</h3>
        
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label for="preserve-language" class="text-sm text-foreground cursor-pointer">Orijinal Dili Koru</label>
            <label class="switch">
              <input type="checkbox" id="preserve-language" checked>
              <span class="slider"></span>
            </label>
          </div>
          
          <div class="space-y-2">
            <label for="gemini-api-key" class="text-xs text-muted-foreground">Gemini API Key:</label>
            <div class="flex space-x-2">
              <input 
                type="password" 
                id="gemini-api-key" 
                placeholder="Gemini API Key girin..."
                class="api-key-input flex-1 text-xs"
              />
              <button id="save-api-key" class="btn-save-api text-xs">💾</button>
            </div>
            <p class="text-xs text-muted-foreground">
              <a href="https://makersuite.google.com/app/apikey" target="_blank" class="text-blue-500 hover:underline">
                🔗 API Key alın
              </a>
            </p>
          </div>
        </div>
      </div>

      <!-- Separator -->
      <div class="border-t"></div>

      <!-- Settings -->
      <div class="space-y-3">
        <h3 class="text-sm font-medium text-foreground">⚙️ Genel Ayarlar</h3>
        
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <label for="remove-ads" class="text-sm text-foreground cursor-pointer">Reklamları Kaldır</label>
            <label class="switch">
              <input type="checkbox" id="remove-ads" checked>
              <span class="slider"></span>
            </label>
          </div>
          
          <div class="flex items-center justify-between">
            <label for="keep-links" class="text-sm text-foreground cursor-pointer">Linkleri Koru</label>
            <label class="switch">
              <input type="checkbox" id="keep-links" checked>
              <span class="slider"></span>
            </label>
          </div>
          
          <div class="flex items-center justify-between">
            <label for="add-metadata" class="text-sm text-foreground cursor-pointer">Meta Bilgi Ekle</label>
            <label class="switch">
              <input type="checkbox" id="add-metadata" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
      </div>

      <!-- Separator -->
      <div class="border-t"></div>

      <!-- History Section -->
      <div class="space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-medium text-foreground">📚 Geçmiş</h3>
          <button id="clear-history" class="text-xs text-muted-foreground hover:text-foreground transition-colors cursor-pointer">Temizle</button>
        </div>
        
        <div id="history-list" class="space-y-2 max-h-32 overflow-y-auto">
          <p class="text-xs text-muted-foreground text-center py-2">Henüz çevrilmiş içerik yok</p>
        </div>
      </div>

      <!-- Author Info -->
      <div class="space-y-3 pt-2 border-t">
        <div class="flex items-center justify-center space-x-2">
          <span class="text-xs text-muted-foreground">Made with</span>
          <span class="text-red-500 animate-pulse">❤️</span>
          <span class="text-xs text-muted-foreground">by</span>
          <span class="text-xs font-bold gradient-text">
            zwennnnn
          </span>
        </div>
        
        <div class="flex items-center justify-center space-x-4">
          <a 
            href="https://github.com/zwennnnnn" 
            target="_blank" 
            class="author-link flex items-center space-x-1"
            title="GitHub Profile"
          >
            <span class="text-xs">🐙</span>
            <span class="text-xs">GitHub</span>
          </a>
          
          <span class="text-muted-foreground text-xs">•</span>
          
          <a 
            href="https://linkedin.com/in/yagizeke" 
            target="_blank" 
            class="author-link flex items-center space-x-1"
            title="LinkedIn Profile"
          >
            <span class="text-xs">💼</span>
            <span class="text-xs">LinkedIn</span>
          </a>
        </div>
        
        <div class="text-center">
          <p class="text-xs text-muted-foreground">
            AI powered web content to Markdown converter
          </p>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
